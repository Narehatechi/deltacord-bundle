name: Check

# Type check, lint and build on every push and pull request, so problems show before a release.
on:
    push:
        branches: [main, dev]
    pull_request:
    workflow_dispatch:

jobs:
    check:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
          - uses: actions/checkout@v4
          - uses: oven-sh/setup-bun@v2
            with:
              bun-version: latest
          - name: Install dependencies
            run: bun install --frozen-lockfile
          - name: Type check
            run: bunx tsc --noEmit -p . 2>&1 | tee tsc.txt; exit ${PIPESTATUS[0]}
            continue-on-error: true
          - name: Lint
            run: bunx eslint ./src --ext .js,.jsx,.ts,.tsx -f unix 2>&1 | tee eslint.txt; exit ${PIPESTATUS[0]}
            continue-on-error: true
          - name: Build
            run: bun run build
          - name: Keep the reports (on the ci-reports branch)
            if: always() && github.event_name != 'pull_request'
            run: |
              mkdir -p /tmp/reports && cp tsc.txt eslint.txt /tmp/reports/ 2>/dev/null || true
              cd /tmp/reports
              git init -q && git checkout -q -b ci-reports
              git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              echo "${{ github.sha }}" > commit.txt
              git add -A && git commit -q -m "Check reports for ${{ github.sha }}"
              git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-reports
